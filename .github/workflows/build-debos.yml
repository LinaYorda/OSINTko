name: Build debos images

on:
  push:
    paths:
      - 'debos/**'
      - '.github/workflows/build-debos.yml'
  pull_request:
    paths:
      - 'debos/**'
      - '.github/workflows/build-debos.yml'
  workflow_dispatch: {}

jobs:
  build-amd64:
    runs-on: ubuntu-24.04
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift || true
          df -h /

      - uses: actions/checkout@v4

      - name: Install debos
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends debos qemu-utils
          sudo rm -rf /var/lib/apt/lists/*

      - name: Build amd64 qcow2
        run: |
          mkdir -p images
          sudo debos \
            --memory=4G \
            --scratchsize=40G \
            --artifactdir=images \
            -t hostname:osintko \
            -t imagename:osintko-amd64 \
            -t username:osintko \
            -t password:osintko \
            debos/osintko-amd64.yaml

      - name: Fix output ownership
        run: sudo chown -R "$USER:$USER" images/

      - uses: actions/upload-artifact@v4
        with:
          name: osintko-amd64-qcow2
          path: images/*.qcow2
          if-no-files-found: error
          retention-days: 3

  build-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/local/.ghcup \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/share/dotnet \
            /usr/local/share/powershell \
            /usr/share/swift || true
          df -h /

      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build arm64 builder image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: debos/Dockerfile.arm64
          tags: osintko-arm64-builder:latest
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: DEBUG - runner disk space before build
        run: df -h

      - name: Build arm64 qcow2
        run: |
          mkdir -p images
          docker run --rm \
            --privileged \
            --net host \
            --tmpfs /run \
            --tmpfs /tmp \
            --volume /dev:/dev \
            --volume "$(pwd):/recipes" \
            --workdir /recipes \
            osintko-arm64-builder:latest \
            debos \
              --memory=4G \
              --scratchsize=8G \
              --artifactdir=images \
              -t hostname:osintko \
              -t imagename:osintko-arm64 \
              -t username:osintko \
              -t password:osintko \
              debos/osintko-arm64.yaml

      - name: Fix output ownership
        run: sudo chown -R "$USER:$USER" images/

      - name: DEBUG - runner disk space after build
        run: df -h

      - name: DEBUG - boot-test the qcow2 with plain QEMU (bypasses UTM entirely)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64
          sudo rm -rf /var/lib/apt/lists/*
          cp /usr/share/AAVMF/AAVMF_VARS.fd vars.fd

          # No /dev/kvm on this runner (confirmed: GitHub's arm64 runners
          # don't expose it), so this is unaccelerated - only needs to run
          # long enough to show whether GRUB starts, not to finish booting.
          # virtio-blk-pci matches UTM's own PciRoot(...)/Pci(...) topology
          # from the failure screenshots, for a fair comparison.
          timeout 120 qemu-system-aarch64 \
            -M virt -cpu max -m 2048 \
            -nographic \
            -drive if=pflash,format=raw,readonly=on,file=/usr/share/AAVMF/AAVMF_CODE.fd \
            -drive if=pflash,format=raw,file=vars.fd \
            -drive file=images/osintko-arm64.qcow2,format=qcow2,if=none,id=hd0 \
            -device virtio-blk-pci,drive=hd0 \
            | tee qemu-boot-test.log || true

          echo "=== Boot test finished (timed out after 120s or exited) ==="
          if grep -q "grub rescue" qemu-boot-test.log; then
            echo "RESULT: GRUB started but hit rescue mode (same as UTM)"
          elif grep -qi "Welcome to GRUB\|Loading Linux\|login:" qemu-boot-test.log; then
            echo "RESULT: boot progressed past GRUB - looks OK here"
          else
            echo "RESULT: no GRUB output seen - check log above for UEFI shell/other failure"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: osintko-arm64-qcow2-boot-log
          path: qemu-boot-test.log
          if-no-files-found: warn
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: osintko-arm64-qcow2
          path: images/*.qcow2
          if-no-files-found: error
          retention-days: 3
